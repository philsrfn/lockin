# Production stack for a single Hetzner box.
#
# Only Caddy binds a host port. The API and Postgres are reachable only on the
# internal docker network — the API's entire auth is one bearer token, so it has
# no business listening on a public interface, and a Postgres open to the
# internet is how single-user projects end up in a breach list.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      LOCKIN_DOMAIN: ${LOCKIN_DOMAIN:?set LOCKIN_DOMAIN in .env}
    depends_on:
      - api
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    # No ports: Caddy reaches it over the compose network.
    environment:
      DATABASE_URL: postgres://lockin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/lockin
      APP_BEARER_TOKEN: ${APP_BEARER_TOKEN:?set APP_BEARER_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-gemini-3.6-flash}
      GEMINI_MODEL_SMART: ${GEMINI_MODEL_SMART:-gemini-3.6-flash}
      PORT: 3000
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # No ports either. Reach it with `docker compose exec db psql`.
    environment:
      POSTGRES_USER: lockin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: lockin
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockin -d lockin"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
