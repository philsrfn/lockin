services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lockin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lockin}
      POSTGRES_DB: lockin
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # 5433 on the host: 5432 is already taken by the other Postgres on this machine.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockin -d lockin"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lockin:${POSTGRES_PASSWORD:-lockin}@db:5432/lockin
      APP_BEARER_TOKEN: ${APP_BEARER_TOKEN:?set APP_BEARER_TOKEN in .env}
      PORT: 3000
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
